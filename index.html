<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Mirror</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Web Mirror</h1>
    <div class="mirror-wrapper">
      <video id="mirror" autoplay playsinline></video>
    </div>
    <div class="controls">
      <button id="startBtn">カメラを起動</button>
      <button id="stopBtn" disabled>カメラを停止</button>
    </div>
    <p id="status" class="status"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
